name: phase0-trust

on:
  workflow_run:
    workflows: [phase0-verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open candidate PR number
        required: true
        type: string
      audited_head_sha:
        description: Independently audited exact head SHA
        required: true
        type: string
      audited_base_sha:
        description: Independently audited exact base SHA
        required: true
        type: string
      audited_tree_sha:
        description: Independently audited exact tree SHA
        required: true
        type: string
      approval_phrase:
        description: Type EXACT-SHA-AUDIT-PASS
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: phase0-trust-${{ github.repository }}
  cancel-in-progress: false

jobs:
  evaluate-verify:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: phase0-trust
    steps:
      - name: Check out exact trusted helper revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: phase0-trusted-source

      - name: Verify trusted helper checkout
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C phase0-trusted-source rev-parse HEAD)" = "$EXPECTED"
          test -f phase0-trusted-source/scripts/audit/phase0-gate-check.mjs
          test -f phase0-trusted-source/scripts/audit/phase0-merge.mjs

      - name: Re-fetch identity and classify exact live candidate
        id: decision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
          HELPER: ${{ github.workspace }}/phase0-trusted-source/scripts/audit/phase0-merge.mjs
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const { validateFileEnumeration, validateLivePull, infrastructurePath } = await import(pathToFileURL(process.env.HELPER).href);
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run?.id;
            if (!Number.isSafeInteger(runId)) throw new Error("missing workflow_run id");
            const workflow = (await github.request("GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}", { owner, repo, workflow_id: "phase0-verify.yml" })).data;
            const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId })).data;
            const path = String(run.path ?? "").replace(/@refs\/[^@]+$/, "");
            if (run.workflow_id !== workflow.id || path !== ".github/workflows/phase0-verify.yml" || run.event !== "pull_request" || run.head_repository?.full_name !== `${owner}/${repo}` || !/^[0-9a-f]{40}$/.test(run.head_sha ?? "") || !Number.isInteger(run.run_attempt) || run.run_attempt < 1) throw new Error("untrusted verifier identity");
            const related = (await github.request("GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls", { owner, repo, commit_sha: run.head_sha, headers: { accept: "application/vnd.github+json" } })).data.filter((p) => p.state === "open" && p.base?.ref === "main" && p.head?.repo?.full_name === `${owner}/${repo}` && p.head?.sha === run.head_sha);
            if (related.length !== 1) throw new Error(`expected one open same-repository PR; found ${related.length}`);
            const pull = (await github.rest.pulls.get({ owner, repo, pull_number: related[0].number })).data;
            const main = (await github.rest.git.getRef({ owner, repo, ref: "heads/main" })).data.object.sha;
            if (main !== process.env.TRUSTED_WORKFLOW_SHA) throw new Error("live main changed");
            validateLivePull(pull, { owner, repo, head: run.head_sha, base: main });
            const commit = (await github.rest.repos.getCommit({ owner, repo, ref: run.head_sha })).data;
            const compare = (await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${main}...${run.head_sha}` })).data;
            if (commit.parents?.length !== 1 || commit.parents[0].sha !== main || compare.merge_base_commit?.sha !== main || compare.ahead_by !== 1 || compare.behind_by !== 0 || compare.total_commits !== 1) throw new Error("candidate graph is not exact one-ahead shape");
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pull.number, per_page: 100 });
            validateFileEnumeration(files, pull.changed_files);
            const accepted = new Set(["added", "modified", "removed", "renamed", "copied", "changed"]);
            const infrastructure = files.some((f) => !accepted.has(f.status) || infrastructurePath(f.filename) || infrastructurePath(f.previous_filename));
            for (const [key, value] of Object.entries({ target_sha: run.head_sha, conclusion: run.conclusion === "success" ? "success" : "failure", infrastructure: String(infrastructure), workflow_id: String(run.workflow_id), run_id: String(run.id), attempt: String(run.run_attempt), pr: String(pull.number), base: main, url: run.html_url })) core.setOutput(key, value);

      - name: Mint Gate App Checks-only token
        id: gate-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.PHASE0_APP_ID }}
          private-key: ${{ secrets.PHASE0_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Record canonical Gate decision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HELPER: ${{ github.workspace }}/phase0-trusted-source/scripts/audit/phase0-gate-check.mjs
          HEAD: ${{ steps.decision.outputs.target_sha }}
          CONCLUSION: ${{ steps.decision.outputs.conclusion }}
          INFRA: ${{ steps.decision.outputs.infrastructure }}
          WORKFLOW_ID: ${{ steps.decision.outputs.workflow_id }}
          RUN_ID: ${{ steps.decision.outputs.run_id }}
          ATTEMPT: ${{ steps.decision.outputs.attempt }}
          PR: ${{ steps.decision.outputs.pr }}
          BASE: ${{ steps.decision.outputs.base }}
          URL: ${{ steps.decision.outputs.url }}
        with:
          github-token: ${{ steps.gate-token.outputs.token }}
          script: |
            const { pathToFileURL } = require("node:url");
            const { upsertPhase0GateCheck } = await import(pathToFileURL(process.env.HELPER).href);
            const result = await upsertPhase0GateCheck({ github, ...context.repo, candidateSha: process.env.HEAD, conclusion: process.env.CONCLUSION, infrastructure: process.env.INFRA === "true", detailsUrl: process.env.URL, title: process.env.CONCLUSION === "success" ? "Phase 0 verification passed" : "Phase 0 verification failed", summary: `Verifier ${process.env.RUN_ID}/${process.env.ATTEMPT}; PR #${process.env.PR}; base ${process.env.BASE}`, source: { workflowId: Number(process.env.WORKFLOW_ID), runId: Number(process.env.RUN_ID), runAttempt: Number(process.env.ATTEMPT), pullNumber: Number(process.env.PR), baseSha: process.env.BASE } });
            core.notice(`${result.operation} Gate Check Run ${result.checkRunId}`);

  merge-audited-candidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: phase0-trust
    steps:
      - name: Check out exact trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: phase0-trusted-source

      - name: Verify trusted helper revision
        id: helper
        run: |
          set -euo pipefail
          actual="$(git -C phase0-trusted-source rev-parse HEAD)"
          test "$actual" = "${{ github.sha }}"
          test -f phase0-trusted-source/scripts/audit/phase0-gate-check.mjs
          test -f phase0-trusted-source/scripts/audit/phase0-merge.mjs
          test -f phase0-trusted-source/scripts/audit/verify-merge.mjs
          echo "sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Prepare P1 through P11 with read-only token
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HELPER: ${{ github.workspace }}/phase0-trusted-source/scripts/audit/phase0-merge.mjs
          HELPER_SHA: ${{ steps.helper.outputs.sha }}
          PR: ${{ inputs.pr_number }}
          HEAD: ${{ inputs.audited_head_sha }}
          BASE: ${{ inputs.audited_base_sha }}
          TREE: ${{ inputs.audited_tree_sha }}
          PHRASE: ${{ inputs.approval_phrase }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const helper = await import(pathToFileURL(process.env.HELPER).href);
            const prepared = await helper.prepareBeforeMerge({ github, ...context.repo, trustedSha: context.sha, helperSha: process.env.HELPER_SHA, dispatchRunId: Number(context.runId), dispatchAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), dispatch: { ref: context.ref, actor: context.actor, prNumber: process.env.PR, head: process.env.HEAD, base: process.env.BASE, tree: process.env.TREE, approvalPhrase: process.env.PHRASE } });
            core.setOutput("prepared", Buffer.from(JSON.stringify(prepared)).toString("base64"));
            core.setOutput("needs_gate_token", String(prepared.requiresGateToken));

      - name: Mint Gate App token only for P7 cleanup or infrastructure P9
        id: gate-token
        if: steps.prepare.outputs.needs_gate_token == 'true'
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.PHASE0_APP_ID }}
          private-key: ${{ secrets.PHASE0_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Finalize P9 through P13
        id: preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HELPER: ${{ github.workspace }}/phase0-trusted-source/scripts/audit/phase0-merge.mjs
          GATE_TOKEN: ${{ steps.gate-token.outputs.token }}
          PREPARED: ${{ steps.prepare.outputs.prepared }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const helper = await import(pathToFileURL(process.env.HELPER).href);
            const prepared = JSON.parse(Buffer.from(process.env.PREPARED, "base64").toString());
            const gateGithub = process.env.GATE_TOKEN ? getOctokit(process.env.GATE_TOKEN) : undefined;
            const validated = await helper.finalizeBeforeMerge({ github, gateGithub, ...context.repo, prepared, trustedSha: context.sha });
            const compact = { ...validated, rulesets: { a: { id: validated.rulesets.a.id, hash: validated.rulesets.a.hash }, b: { id: validated.rulesets.b.id, hash: validated.rulesets.b.hash } } };
            core.setOutput("evidence", Buffer.from(JSON.stringify(compact)).toString("base64"));
            core.setOutput("ruleset_a", `${validated.rulesets.a.id}:${validated.rulesets.a.hash}`);
            core.setOutput("ruleset_b", `${validated.rulesets.b.id}:${validated.rulesets.b.hash}`);

      # P14: this token is deliberately minted only after P1-P13 completed.
      - name: Mint single-purpose Merger App token
        id: merger-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.PHASE0_MERGER_APP_ID }}
          private-key: ${{ secrets.PHASE0_MERGER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Perform one exact-SHA merge and verify I1 through I7
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HELPER: ${{ github.workspace }}/phase0-trusted-source/scripts/audit/phase0-merge.mjs
          MERGER_TOKEN: ${{ steps.merger-token.outputs.token }}
          EVIDENCE: ${{ steps.preflight.outputs.evidence }}
        with:
          script: |
            const { pathToFileURL } = require("node:url");
            const helper = await import(pathToFileURL(process.env.HELPER).href);
            const validated = JSON.parse(Buffer.from(process.env.EVIDENCE, "base64").toString());
            const result = await helper.mergeOnce({ mergerGithub: getOctokit(process.env.MERGER_TOKEN), readGithub: github, ...context.repo, validated });
            await core.summary.addHeading("Phase 0 trusted merge").addCodeBlock(JSON.stringify({ pr: validated.audit.prNumber, base: validated.audit.base, head: validated.audit.head, auditedTree: validated.audit.tree, mergeSha: result.mergeSha, mergeTree: result.mergeTree, gateId: validated.gateId, gateProvenance: validated.gateExternalId, gateCompletedAt: validated.gateCompletedAt, dispatch: `${validated.dispatchIdentity.runId}/${validated.dispatchIdentity.attempt}`, rulesetA: validated.rulesets.a, rulesetB: validated.rulesets.b, ruleSuite: result.ruleSuite }, null, 2)).write();

      - name: Independent Git-level merge verification
        env:
          BASE: ${{ inputs.audited_base_sha }}
          HEAD: ${{ inputs.audited_head_sha }}
        run: |
          set -euo pipefail
          git -C phase0-trusted-source fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node phase0-trusted-source/scripts/audit/verify-merge.mjs --merge origin/main --base "$BASE" --head "$HEAD" --live-main origin/main
